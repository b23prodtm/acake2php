version: 2.1

orbs:
  shellcheck: circleci/shellcheck@1.3.16

executors:
  docker-executor:
    docker:
      - image: cimg/base:2025.11
    resource_class: medium

commands:
  build-multiarch:
    parameters:
      image:
        type: string
      workdir:
        type: string
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.18
          docker_layer_caching: true

      - run:
          name: Enable QEMU for multi-arch
          command: |
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - run:
          name: Build amd64
          command: |
            cd << parameters.workdir >>
            docker build \
              --platform linux/amd64 \
              -t "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-x86_64" \
              -f Dockerfile.x86_64 .
            docker push "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-x86_64"

      - run:
          name: Build arm64
          command: |
            cd << parameters.workdir >>
            docker build \
              --platform linux/arm64 \
              -t "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-aarch64" \
              -f Dockerfile.aarch64 .
            docker push "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-aarch64"

      - run:
          name: Build armhf
          command: |
            cd << parameters.workdir >>
            docker build \
              --platform linux/arm/v7 \
              -t "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-armhf" \
              -f Dockerfile.armhf .
            docker push "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-armhf"

      - run:
          name: Create multi-arch manifest
          command: |
            docker manifest create "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}" \
              "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-x86_64" \
              "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-aarch64" \
              "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}-armhf"

            docker manifest push "$DOCKER_USER/<< parameters.image >>:${CIRCLE_TAG}"


jobs:
  shellcheck-job:
    executor: docker-executor
    steps:
      - checkout
      - shellcheck/check:
          ignore: 'SC2154,SC1091,SC2034,SC2096,SC2038'

  httpd:
    executor: docker-executor
    steps:
      - build-multiarch:
          image: httpd
          workdir: deployment/images/httpd

  mysql:
    executor: docker-executor
    steps:
      - build-multiarch:
          image: mysql
          workdir: deployment/images/mysql

  php-fpm:
    executor: docker-executor
    steps:
      - build-multiarch:
          image: php-fpm
          workdir: deployment/images/php-fpm

  build-and-compose:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.18
          docker_layer_caching: true
      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
      - run:
          name: Deploy with docker compose
          command: |
            cd deployment
            docker compose pull
            docker compose up -d


workflows:
  version: 2
  build:
    jobs:
      - shellcheck/check:
          requires:
            - shellcheck-job
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - httpd:
          requires:
            - shellcheck/check
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - mysql:
          requires:
            - shellcheck/check
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - php-fpm:
          requires:
            - shellcheck/check
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - build-and-compose:
          requires:
            - httpd
            - mysql
            - php-fpm
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
