version: 2.1
aliases:
  - &deps
    run:
      name: Install dependencies
      command: |
        git submodule sync
        git submodule update --init --recursive
        apk update \
          && apk upgrade \
          && apk add \
            nodejs \
            npm \
            xz \
          && apk del build-base \
          && rm -rf /var/cache/apk/*
        npm install --global yarn \
        && yarn
        npm link balena-cloud-apps
        balena_deploy . $BALENA_ARCH --nobuild --exit
  - &caches
    save_cache:
      key: v1-dependencies-{{ checksum "yarn.lock" }}
      paths:
        - app/Vendor
        - webroot/php-cms
        - node_modules

orbs:
  shellcheck: circleci/shellcheck@1.3.16
jobs:
  build:
    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    resource_class: b23prodtm/runner
    docker:
      - image: betothreeprod/apache-php7:latest-x86_64
      - image: betothreeprod/mysqldb:latest-x86_64
        environment:
          PUID: 0
          PGID: 0
          TZ: Europe/Paris
          MYSQL_ROOT_PASSWORD: mariadb
          MYSQL_HOST: localhost
          MYSQL_DATABASE: aria_db
          MYSQL_USER: maria
          MYSQL_PASSWORD: maria-abc
    shell: /bin/bash -leo pipefail
    environment:
      - BASH_ENV: /etc/profile
      - BALENA_ARCH: x86_64
      - MYSQL_HOST: 127.0.0.1
      - MYSQL_TCP_PORT: 3306
    working_directory: /var/www/html/
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
      #- setup_remote_docker:
      #    docker_layer_caching: false
      - *deps
      - *caches
      - run:
          name: Waiting for Mysql to be ready
          command: |
            set -x
            for i in `seq 1 10`;
            do
              nc -z $MYSQL_HOST $MYSQL_TCP_PORT && echo Success && exit 0
              echo -n .
              sleep 1
            done
            echo 'Failed waiting for Mysql' && exit 1
      - run:
          command: |
            set -u
            mkdir -p ./app/build/logs
            mkdir -p ~/phpunit
            ./test-cake.sh --circle
            . common.env && cat $MYPHPCMS_DIR/e13/etc/constantes.properties | grep PASSWORD_ADMIN | head -c 18
          when: always
  compose:
    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    resource_class: b23prodtm/runner
    docker:
      - image: docker:dind
    shell: /bin/bash -leo pipefail
    environment:
      - BASH_ENV: /etc/profile
      - BALENA_ARCH: x86_64
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "yarn.lock" }}
      #- setup_remote_docker:
      #    docker_layer_caching: false
      - *deps
      - *caches
      - run:
          command: |
            set -u
            TAG=0.1.$CIRCLE_BUILD_NUM
            docker-compose -f docker-compose.$BALENA_ARCH build
      - store_test_results:
          path: ~/phpunit
      - store_artifacts:
          path: ~/phpunit
workflows:
  cleanup:
    jobs:
      - shellcheck/check:
          ignore: 'SC1091,SC2034,SC2096,SC2038'
  build-and-compose:
    jobs:
      - build
      - compose:
          requires:
            - build
          context: Info-b23prodtm
  version: 2
