version: 2.1
orbs:
  shellcheck: circleci/shellcheck@1.3.16
jobs:  
  build:
    docker:
      - image: cimg/base:2022.09       
        environment:
          TAG: latest-x86_64
          IMAGE: php7
          BUILD_ARCH: x86_64
          WORK_DIR: deployment/images/php7
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    steps:
      - checkout:
          method: blobless
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            cd $WORK_DIR
            docker build -t $DOCKER_USER/$IMAGE:$TAG -f Dockerfile.$BUILD_ARCH .
      - run:
          name: Push application Docker image
          command: |
            echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin
            docker push $DOCKER_USER/$IMAGE:$TAG
  build-test:
    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    # resource_class: b23prodtm/linux
    docker:
      - image: cimg/base:2022.09       
        environment:
          TAG: latest-x86_64
          IMAGE: mariadb
          BUILD_ARCH: x86_64
          WORK_DIR: deployment/images/mysqldb
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    steps:
      - checkout: 
          method: blobless
      - setup_remote_docker:
          version: edge
          docker_layer_caching: false
      - run:
          name: Build Docker image
          command: |
            cd $WORK_DIR
            docker build -t $DOCKER_USER/$IMAGE:$TAG -f Dockerfile.$BUILD_ARCH .
      - run:
          name: Push application Docker image
          command: |
            echo $DOCKER_PASS | docker login -u $DOCKER_USER --password-stdin
            docker push $DOCKER_USER/$IMAGE:$TAG
  compose:
    # The resource_class feature allows configuring CPU and RAM resources for each job. Different resource classes are available for different executors. https://circleci.com/docs/2.0/configuration-reference/#resourceclass
    # resource_class: b23prodtm/linux
    docker:
      - image: cimg/aws:2025.01
    shell: /bin/bash -leo pipefail
    environment:
      - BASH_ENV: /etc/profile
      - BUILD_ARCH: x86_64
    steps:
      - checkout: 
          method: blobless
      - setup_remote_docker:
          version: edge
          docker_layer_caching: true
      - run:
          command: |
            set -u
            TAG=0.1.$CIRCLE_BUILD_NUM
            yarn install --immutable
            docker-compose -f docker-compose.$BUILD_ARCH build
workflows:
  cleanup:
    jobs:
      - shellcheck/check:
          ignore: 'SC2154,SC1091,SC2034,SC2096,SC2038'
  build-and-compose:
    jobs:
      - build
      - build-test:
          requires:
            - build
      - compose:
          requires:
            - build-test
  version: 2
