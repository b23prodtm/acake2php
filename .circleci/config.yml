version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/base:2025.11
    resource_class: medium

commands:
  setup-buildx:
    steps:
      - run:
          name: Install Docker Buildx
          command: |
            mkdir -p ~/.docker/cli-plugins
            BUILDX_VERSION=v0.12.1
            wget -q "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
              -O ~/.docker/cli-plugins/docker-buildx
            chmod +x ~/.docker/cli-plugins/docker-buildx
            docker buildx version

      - run:
          name: Create buildx builder
          command: |
            docker buildx create --name multiarch --driver docker-container --use --bootstrap
            docker buildx inspect multiarch

  write-secrets:
    description: "Store secrets in secret file on build-time"
    steps:
      - run:
          name: Store secrets
          command: |
            echo "$MYSQL_ROOT_PASSWORD" > .balena/secrets/secret_mysql_root_password
            echo "$MYSQL_USER" > .balena/secrets/secret_mysql_user
            echo "$MYSQL_PASSWORD" > .balena/secrets/secret_mysql_password
            echo "$MYSQL_DATABASE" > .balena/secrets/secret_mysql_database
            echo "$MASTER_PASSWORD" > .balena/secrets/secret_master_password
            
  set-build-tag:
    description: "Set BUILD_TAG environment variable based on branch or tag"
    steps:
      - run:
          name: Set build tag
          command: |
            if [ -n "${CIRCLE_TAG}" ]; then
              TAG="${CIRCLE_TAG}"
            else
              TAG="${CIRCLE_BRANCH}-${CIRCLE_SHA1:0:7}"
            fi
            # lowercase
            TAG=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
            # replace invalid chars with '-'
            echo "export BUILD_TAG=$(echo "$TAG" | sed 's/[^a-z0-9._-]/-/g')" >> $BASH_ENV
            source $BASH_ENV
            echo "Build tag: ${BUILD_TAG}"
            
jobs:
  shellcheck:
    docker:
      - image: koalaman/shellcheck-alpine:stable
    steps:
      - checkout
      - run:
          name: Run shellcheck
          command: |
            find . -type f -name "*.sh" -exec shellcheck --exclude=SC2154,SC1091,SC2034,SC2096,SC2038 {} +

  build-x86_64:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
          docker_layer_caching: true

      - setup-buildx
      - set-build-tag
      - write-secrets

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
      
      - run:
          name: Build and push x86_64
          command: |
            export DOCKER_ORG=${DOCKER_USER}
            export BAKE_TAG=${BUILD_TAG}
            export BALENA_ARCH=x86_64
            export PLATFORM=linux/amd64
            
            echo "Building ${DOCKER_ORG}/*:${BAKE_TAG} for ${PLATFORM}"
            ln -sf "${BALENA_ARCH}.env" ".env"
            cp -vf "docker-compose.${BALENA_ARCH}" "docker-compose.yml"
            docker buildx bake -f docker-bake.hcl \
              --set "*.platform=${PLATFORM}" \
              --push

      - run:
          name: Tag images with architecture suffix
          command: |
            for service in mysqldb php-fpm httpd balena-storage; do
              docker buildx imagetools create \
                --tag ${DOCKER_USER}/${service}:${BUILD_TAG}-x86_64 \
                ${DOCKER_USER}/${service}:${BUILD_TAG}
            done

  build-aarch64:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
          docker_layer_caching: true

      - setup-buildx
      - set-build-tag
      - write-secrets

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - run:
          name: Build and push aarch64
          command: |
            export DOCKER_ORG=${DOCKER_USER}
            export BAKE_TAG=${BUILD_TAG}
            export BALENA_ARCH=aarch64
            export PLATFORM=linux/arm64
            
            echo "Building ${DOCKER_ORG}/*:${BAKE_TAG} for ${PLATFORM}"
            ln -sf "${BALENA_ARCH}.env" ".env"
            cp -vf "docker-compose.${BALENA_ARCH}" "docker-compose.yml"            
            docker buildx bake -f docker-bake.hcl \
              --set "*.platform=${PLATFORM}" \
              --push

      - run:
          name: Tag images with architecture suffix
          command: |
            for service in mysqldb php-fpm httpd balena-storage; do
              docker buildx imagetools create \
                --tag ${DOCKER_USER}/${service}:${BUILD_TAG}-aarch64 \
                ${DOCKER_USER}/${service}:${BUILD_TAG}
            done

  build-armhf:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
          docker_layer_caching: true

      - setup-buildx
      - set-build-tag
      - write-secrets

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - run:
          name: Build and push armhf
          command: |
            export DOCKER_ORG=${DOCKER_USER}
            export BAKE_TAG=${BUILD_TAG}
            export BALENA_ARCH=armhf
            export PLATFORM=linux/arm/v7
            
            echo "Building ${DOCKER_ORG}/*:${BAKE_TAG} for ${PLATFORM}"
            ln -sf "${BALENA_ARCH}.env" ".env"
            cp -vf "docker-compose.${BALENA_ARCH}" "docker-compose.yml"       
            docker buildx bake -f docker-bake.hcl \
              --set "*.platform=${PLATFORM}" \
              --push

      - run:
          name: Tag images with architecture suffix
          command: |
            for service in mysqldb php-fpm httpd balena-storage; do
              docker buildx imagetools create \
                --tag ${DOCKER_USER}/${service}:${BUILD_TAG}-armhf \
                ${DOCKER_USER}/${service}:${BUILD_TAG}
            done

  create-manifests:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24

      - set-build-tag

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - run:
          name: Create and push multi-arch manifests
          command: |
            for service in mysqldb php-fpm httpd balena-storage; do
              echo "Creating manifest for ${service}:${BUILD_TAG}"
              
              # Create multi-arch manifest
              docker manifest create ${DOCKER_USER}/${service}:${BUILD_TAG} \
                ${DOCKER_USER}/${service}:${BUILD_TAG}-x86_64 \
                ${DOCKER_USER}/${service}:${BUILD_TAG}-aarch64 \
                ${DOCKER_USER}/${service}:${BUILD_TAG}-armhf
              
              docker manifest push ${DOCKER_USER}/${service}:${BUILD_TAG}
              
              # Also create/update latest tag for main branch
              if [ "${CIRCLE_BRANCH}" = "main" ] || [ "${CIRCLE_BRANCH}" = "master" ]; then
                echo "Updating latest tag for ${service}"
                docker manifest create ${DOCKER_USER}/${service}:latest \
                  ${DOCKER_USER}/${service}:${BUILD_TAG}-x86_64 \
                  ${DOCKER_USER}/${service}:${BUILD_TAG}-aarch64 \
                  ${DOCKER_USER}/${service}:${BUILD_TAG}-armhf
                
                docker manifest push ${DOCKER_USER}/${service}:latest
              fi
            done

      - run:
          name: Verify manifests
          command: |
            for service in mysqldb php-fpm httpd balena-storage; do
              echo "Verifying ${service}:${BUILD_TAG}"
              docker manifest inspect ${DOCKER_USER}/${service}:${BUILD_TAG}
            done

workflows:
  build-all-branches:
    jobs:
      - shellcheck

      - build-x86_64:
          context:
            - Info-b23prodtm
          requires:
            - shellcheck
          filters:
            branches:
              only: development

      - build-aarch64:
          context:
            - Info-b23prodtm
          requires:
            - shellcheck

      - build-armhf:
          context:
            - Info-b23prodtm
          requires:
            - shellcheck

      - create-manifests:
          requires:
            - build-x86_64
            - build-aarch64
            - build-armhf
          filters:
            branches:
              only: development

