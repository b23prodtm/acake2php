version: 2.1

orbs:
  shellcheck: circleci/shellcheck@3.2.0

executors:
  docker-executor:
    docker:
      - image: cimg/base:2025.01
    resource_class: medium

commands:
  setup-buildx:
    steps:
      - run:
          name: Install Docker Buildx
          command: |
            mkdir -p ~/.docker/cli-plugins
            BUILDX_VERSION=v0.12.1
            wget -q "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
              -O ~/.docker/cli-plugins/docker-buildx
            chmod +x ~/.docker/cli-plugins/docker-buildx
            docker buildx version

      - run:
          name: Create buildx builder
          command: |
            docker buildx create --name multiarch --driver docker-container --use --bootstrap
            docker buildx inspect multiarch

jobs:
  shellcheck:
    docker:
      - image: koalaman/shellcheck-alpine:stable
    steps:
      - checkout
      - run:
          name: Run shellcheck
          command: |
            find . -type f -name "*.sh" -exec shellcheck --exclude=SC2154,SC1091,SC2034,SC2096,SC2038 {} +

  build-multiarch:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24
          docker_layer_caching: true

      - setup-buildx

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - run:
          name: Build and push multi-arch images
          command: |
            export DOCKER_ORG=${DOCKER_USER}
            export BAKE_TAG=${CIRCLE_TAG}
            
            echo "Building version: ${BAKE_TAG}"
            
            # Build for all platforms and push
            docker buildx bake -f docker-bake.hcl \
              --set "*.platform=linux/amd64,linux/arm64,linux/arm/v7" \
              --push

      - run:
          name: Verify images
          command: |
            echo "Verifying pushed images:"
            docker manifest inspect ${DOCKER_USER}/mysqldb:${CIRCLE_TAG}
            docker manifest inspect ${DOCKER_USER}/php-fpm:${CIRCLE_TAG}
            docker manifest inspect ${DOCKER_USER}/httpd:${CIRCLE_TAG}
            docker manifest inspect ${DOCKER_USER}/balena-storage:${CIRCLE_TAG}

  deploy-compose:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: docker24

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - run:
          name: Deploy with docker compose
          command: |
            export BALENA_ARCH=$(uname -m)
            echo "Deploying with architecture: ${BALENA_ARCH}"            
            docker compose pull
            docker compose up -d
            docker compose ps

workflows:
  build-on-tag:
    jobs:
      - shellcheck:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - build-multiarch:
          requires:
            - shellcheck
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

      - deploy-compose:
          requires:
            - build-multiarch
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/