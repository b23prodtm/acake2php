## No longer needed
#RewriteCond %{REQUEST_FILENAME} !-f
#RewriteRule ^ /index.php [L]
# USAGE NOTICE:
# this file will be filtered by program:
# apl add gettext: command line: envsubst
# and it cannot be installed "as is"
# This Vhost captures all requests that match www.* or ${SERVER_NAME}
<VirtualHost "*:${SSL_PORT}">
    ServerName ${SERVER_NAME}
    ServerAlias www.${SERVER_NAME}
    ServerAdmin webmaster@${SERVER_NAME}
    ServerRoot ${SERVER_ROOT}
    DocumentRoot ${HTDOCS}
    ErrorLog "logs/${SERVER_NAME}-error_log"
    CustomLog "logs/${SERVER_NAME}-access_log" common
    <Directory "${HTDOCS}">
        DirectoryIndex index.php
        Options +FollowSymLinks
        AllowOverride FileInfo
        Require all granted
        FallbackResource /index.php
    </Directory>
    ProxyPassMatch ^/info$ fcgi://php-fpm:9001/info.php
    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://php-fpm:9001/$1
    SSLEngine on
    SSLCertificateFile ${SERVER_ROOT}/ssl/server.pem
    SSLCertificateKeyFile ${SERVER_ROOT}/ssl/server.key
    #SSLCertificateChainFile ${SERVER_ROOT}/ssl/server-ca.pem
    #SSLCACertificatePath ${SERVER_ROOT}/ssl/ssl.crt
    #SSLCACertificateFile ${SERVER_ROOT}/ssl/ssl.crt/ca-bundle.pem
</VirtualHost>
