## No longer needed
#RewriteCond %{REQUEST_FILENAME} !-f
#RewriteRule ^ /index.php [L]
<VirtualHost *:${HTTP_PORT}>
    DocumentRoot ${HTDOCS}
    <Directory "${HTDOCS}">
        DirectoryIndex index.php
        Options +FollowSymLinks
        AllowOverride FileInfo
        Require all granted
        FallbackResource /index.php
    </Directory>
    ProxyPassMatch ^/info$ fcgi://127.0.0.1:9001/${HTDOCS}/info.php
    ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://127.0.0.1:9001/${HTDOCS}/$1
</VirtualHost>
