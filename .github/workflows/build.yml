name: Multi-Arch Build

on:
  push:
    branches: [ "main", "development", "b23prodtm-patch-1" ]
  pull_request:

env:
  TAG: latest
  DOCKER_ORG: ${{ secrets.DOCKER_USER }}

jobs:

  lint-shell:
    runs-on: ubuntu-latest
    environment: AUTH

    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@v2
        with:
          severity: style

  build-images:
    runs-on: ubuntu-latest
    environment: AUTH
    needs: lint-shell

    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: "httpd",     path: "deployment/images/httpd" }
          - { name: "mariadb",   path: "deployment/images/mysqldb" }
          - { name: "php-fpm",   path: "." }
        arch: [ amd64, arm64, armhf ]

    steps:
      - uses: actions/checkout@v4

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push ${{ matrix.image.name }} (${{ matrix.arch }})
        working-directory: ${{ matrix.image.path }}
        run: |
         
