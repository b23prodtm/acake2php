name: Multi-Arch Build

on:
  push:
    branches: [ "main", "development", "b23prodtm-patch-1" ]
  pull_request:

env:
  TAG: latest
  DOCKER_ORG: ${{ secrets.DOCKER_USER }}

jobs:

  build-images:
    runs-on: ubuntu-latest
    environment: AUTH

    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: "httpd",     path: "deployment/images/httpd" }
          - { name: "mariadb",   path: "deployment/images/mysqldb" }
          - { name: "php-fpm",   path: "." }
        arch: [ amd64, arm64, armhf ]

    steps:
      - uses: actions/checkout@v4

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push ${{ matrix.image.name }} (${{ matrix.arch }})
        working-directory: ${{ matrix.image.path }}
        run: |
          docker buildx build \
            --platform linux/${{ matrix.arch }} \
            --push \
            -t ${{ env.DOCKER_ORG }}/${{ matrix.image.name }}:${{ env.TAG }}-${{ matrix.arch }} \
            -f Dockerfile.${{ matrix.arch }} .

  compose:
    runs-on: ubuntu-latest
    environment: AUTH
    needs: build-images

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin

      - name: Build docker-compose stack (amd64)
        run: |
          docker compose -f docker-compose.amd64 build
