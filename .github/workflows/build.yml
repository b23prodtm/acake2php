name: Multi-Arch Build
on:
  push:
    branches: [ "main", "development" ]
  pull_request:
env:
  DOCKER_ORG: ${{ secrets.DOCKER_USER }}
jobs:
  build-services:
    runs-on: self-hosted
    environment: AUTH
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64, aarch64, armhf ]
    steps:
      - uses: actions/checkout@v4
      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3
      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Sanitize ref name for Docker tag
        id: sanitize
        run: |
          RAW="${{ github.ref_name }}"
          TAG=$(echo "$RAW" | tr '[:upper:]' '[:lower:]')
          TAG=$(echo "$TAG" | sed 's/[^a-z0-9._-]/-/g')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
      - name: Write build secrets to temp files
        run: |
          mkdir -p /tmp/secrets
          printf '%s' '${{ secrets.MYSQL_ROOT_PASSWORD }}' > /tmp/secrets/mysql_root_password.txt
          printf '%s' '${{ secrets.MYSQL_USER }}'          > /tmp/secrets/mysql_user.txt
          printf '%s' '${{ secrets.MYSQL_PASSWORD }}'      > /tmp/secrets/mysql_password.txt
          printf '%s' '${{ secrets.HASH_PASSWORD }}'       > /tmp/secrets/hash_password.txt
      - name: Build docker-compose stack
        env:
          BALENA_ARCH: ${{ matrix.arch }}
          BAKE_TAG: ${{ steps.sanitize.outputs.tag }}
        run: |
          case "${BALENA_ARCH}" in
            "armhf")    export PLATFORM="linux/arm/v7"  ;;
            "aarch64")  export PLATFORM="linux/arm64"   ;;
            "x86_64")   export PLATFORM="linux/amd64"   ;;
            *)          export PLATFORM="linux/$(uname -m)" ;;
          esac
          docker buildx bake -f docker-bake.hcl \
            --set "*.platform=${PLATFORM}" \
            --secret id=mysql_root_password,src=/tmp/secrets/mysql_root_password.txt \
            --secret id=mysql_user,src=/tmp/secrets/mysql_user.txt \
            --secret id=mysql_password,src=/tmp/secrets/mysql_password.txt \
            --secret id=hash_password,src=/tmp/secrets/hash_password.txt \
            --push
      - name: Remove secret files
        if: always()
        run: rm -rf /tmp/secrets

  deploy:
    runs-on: self-hosted
    environment: AUTH
    needs: build-services
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: latest
      - name: Deploy stack
        env:
          BAKE_TAG: ${{ github.ref_name }}
        run: docker compose up -d
