name: Multi-Arch Build

on:
  push:
    branches: [ "main", "development" ]
  pull_request:

env:
  TAG: latest
  DOCKER_ORG: ${{ secrets.DOCKER_USER }}

jobs:

  build-images:
    #runs-on: self-hosted
    runs-on: ubuntu-latest
    environment: AUTH

    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: "httpd",     path: "deployment/images/httpd" }
          - { name: "mariadb",   path: "deployment/images/mysqldb" }
          - { name: "php-fpm",   path: "." }
        arch: [ x86_64, aarch64, armhf ]

    steps:
      - uses: actions/checkout@v4

      - name: Enable QEMU
        uses: docker/setup-qemu-action@v3

      - name: Enable Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build & Push ${{ matrix.image.name }} (${{ matrix.arch }})
        working-directory: ${{ matrix.image.path }}
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            x86_64)   PLATFORM="linux/amd64" ;;
            aarch64)  PLATFORM="linux/arm64" ;;
            armhf)    PLATFORM="linux/arm/v7" ;;
            *)        echo "Unknown arch: $ARCH" >&2; exit 1 ;;
          esac

          docker buildx build \
            --platform "${PLATFORM}" \
            --push \
            -t "${DOCKER_ORG}/${{ matrix.image.name }}:${TAG}-${ARCH}" \
            -f "Dockerfile.${ARCH}" .

  compose:
    #runs-on: self-hosted
    runs-on: ubuntu-latest
    environment: AUTH
    needs: build-images

    steps:
      - uses: actions/checkout@v4

      - name: Install Docker Compose plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin

      - name: Build docker-compose stack (x86_64)
        run: |
          docker compose -f docker-compose.x86_64 build
