version: "2.1"
services:
  db:
    build:
      context: deployment/images/mysqldb
      dockerfile: Dockerfile.x86_64
      args:
        PUID: 0
        PGID: 0
        TZ: Europe/Paris
        MYSQL_ROOT_PASSWORD: mariadb
        MYSQL_HOST: localhost
        MYSQL_DATABASE: aria_db
        MYSQL_USER: maria
        MYSQL_PASSWORD: maria-abc
    volumes:
      - localtime:/etc/localtime:ro
      - db-data:/config
      - db-socket:/var/run/mysqld
      - db-config:/var/www/htdocs/localhost/app/config/Schema
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - cake
    env_file:
      - common.env
      - .env
    labels:
      io.balena.features.dbus: "1"
  acake2php:
    env_file:
      - common.env
      - .env
    build:
      context: .
      dockerfile: Dockerfile.x86_64
      args:
        CAKEPHP_DEBUG_LEVEL: "2"
        MYSQL_HOST: "db"
        PUID: 1000
        PGID: 1000
    labels:
      io.balena.features.dbus: "1"
    volumes:
      - localtime:/etc/localtime:ro
      - db-config:/var/www/htdocs/localhost/app/config/Schema
      - db-socket:/var/run/mysqld
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - db
    networks:
      - cake
  balena-storage:
    build:
      context: balena-storage
      dockerfile: Dockerfile.x86_64
    privileged: true
    env_file:
      - common.env
      - .env
    networks:
      - cake
# v3.4 compose file
#    healthcheck:
#      test: ["CMD", "/usr/src/scripts/backup-db.sh"]
#      interval: 720h
#      timeout: 10s
#      retries: 3
#      start_period: 30m
    volumes:
      - db-backup:/mnt/external-drives
volumes:
  hostapcache:
  db-config:
    external: false
  db-data:
    external: false
  db-socket:
    external: false
  config:
  localtime:
  db-backup:
networks:
  cake:
    external: false
